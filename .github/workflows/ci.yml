name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verify lockfile is up to date
        run: deno install --frozen=true

      - name: Type check
        run: deno task check

      - name: Format check
        run: deno fmt --check

      - name: Lint
        run: deno task lint

      - name: Smoke test
        run: |
          set -euo pipefail
          deno task start &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT

          # Wait for the server to come up.
          for i in $(seq 1 40); do
            if curl -sf http://localhost:8000/ >/dev/null; then
              break
            fi
            sleep 0.25
          done

          echo "::group::static assets"
          curl -sf http://localhost:8000/              > /dev/null
          curl -sf http://localhost:8000/app.js        > /dev/null
          curl -sf http://localhost:8000/style.css     > /dev/null
          echo "::endgroup::"

          echo "::group::crates.io proxy"
          curl -sf "http://localhost:8000/api/registry/crates.io/search?q=serde&per_page=1" \
            | grep -q '"crates"'
          curl -sf "http://localhost:8000/api/registry/crates.io/package/serde" \
            | grep -q '"versions"'
          curl -sfI "http://localhost:8000/api/registry/crates.io/download/serde/1.0.0" \
            | grep -qi '^HTTP/.* 200'
          echo "::endgroup::"

          echo "::group::npm proxy"
          curl -sf "http://localhost:8000/api/registry/npmjs.com/search?q=express&per_page=1" \
            | grep -q '"crates"'
          curl -sf "http://localhost:8000/api/registry/npmjs.com/package/express" \
            | grep -q '"versions"'
          curl -sfI "http://localhost:8000/api/registry/npmjs.com/download/express/4.18.2" \
            | grep -qi '^HTTP/.* 200'
          echo "::endgroup::"

          echo "::group::proxy.golang.org proxy"
          curl -sf "http://localhost:8000/api/registry/proxy.golang.org/search?q=github.com/gin-gonic/gin&per_page=1" \
            | grep -q '"crates"'
          curl -sf "http://localhost:8000/api/registry/proxy.golang.org/package/github.com/gin-gonic/gin" \
            | grep -q '"versions"'
          curl -sfI "http://localhost:8000/api/registry/proxy.golang.org/download/github.com/gin-gonic/gin/v1.9.1" \
            | grep -qi '^HTTP/.* 200'
          echo "::endgroup::"
