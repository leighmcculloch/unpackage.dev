<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>unpackage.dev</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<script>
  // Apply the saved theme before paint so users don't see a flash.
  (function () {
    try {
      var t = localStorage.getItem("unpackage-theme");
      if (t === "light" || t === "dark") {
        document.documentElement.setAttribute("data-theme", t);
      }
    } catch (_) {}
  })();
</script>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<div class="app">
  <div class="topbar">
    <header>
      <div class="header-main">
        <h1><span class="dot" aria-hidden="true"></span>unpackage.dev</h1>
        <p class="tag">Compare any two versions of a package as a folder diff.</p>
      </div>
    </header>

    <section class="search">
      <div class="search-row">
        <select id="registry-sel" class="registry-select" aria-label="Package registry">
          <option value="crates.io">Rust (crates.io)</option>
          <option value="npmjs.com">JavaScript (npmjs.com)</option>
          <option value="jsr.io">TypeScript / Deno (jsr.io)</option>
          <option value="proxy.golang.org">Go (proxy.golang.org)</option>
          <option value="rubygems.org">Ruby (rubygems.org)</option>
          <option value="pypi.org">Python (pypi.org)</option>
          <option value="nuget.org">.NET (nuget.org)</option>
          <option value="hex.pm">Elixir / Erlang (hex.pm)</option>
          <option value="pub.dev">Dart (pub.dev)</option>
          <option value="cran.r-project.org">R (CRAN)</option>
          <option value="juliahub.com">Julia (juliahub.com)</option>
        </select>
        <div class="search-box">
          <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input id="search" type="text" placeholder="Search crates.io&hellip;" autocomplete="off" spellcheck="false" />
        </div>
        <a id="crate-link" class="crate-link btn btn-ghost" target="_blank" rel="noopener" hidden>crates.io &rarr;</a>
      </div>
      <ul id="results" hidden></ul>
    </section>

    <section class="compare-wrap" hidden id="compare">
      <div class="card" id="compare-card">
        <div class="versions">
          <label class="ver">
            <span>old</span>
            <select id="left-version"></select>
          </label>
          <div class="arrow" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
            </svg>
          </div>
          <label class="ver">
            <span>new</span>
            <select id="right-version"></select>
          </label>
        </div>
      </div>
    </section>

    <div class="toolbar" id="toolbar" hidden>
      <span class="site-name" aria-hidden="true">
        <span class="dot"></span>
      </span>
      <span class="compact-summary" id="compact-summary"></span>
      <div class="toolbar-spacer"></div>
      <div class="stats" id="stats"></div>
      <button id="expand-all"   class="btn btn-ghost" type="button">Expand all</button>
      <button id="collapse-all" class="btn btn-ghost" type="button">Collapse all</button>
      <button id="theme-toggle" class="btn btn-ghost" type="button" title="Toggle theme" aria-label="Toggle theme">
        <svg class="icon-to-dark" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <svg class="icon-to-light" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <line x1="12" y1="2"  x2="12" y2="4"/>
          <line x1="12" y1="20" x2="12" y2="22"/>
          <line x1="4.93" y1="4.93"   x2="6.34"  y2="6.34"/>
          <line x1="17.66" y1="17.66" x2="19.07" y2="19.07"/>
          <line x1="2" y1="12"  x2="4" y2="12"/>
          <line x1="20" y1="12" x2="22" y2="12"/>
          <line x1="4.93" y1="19.07"  x2="6.34"  y2="17.66"/>
          <line x1="17.66" y1="6.34"  x2="19.07" y2="4.93"/>
        </svg>
      </button>
      <button id="topbar-toggle" class="btn btn-ghost" type="button" title="Hide top">
        <svg class="chev-up" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="18 15 12 9 6 15"/>
        </svg>
        <span class="label">Hide top</span>
      </button>
    </div>
  </div>

  <div class="workspace">
    <aside class="sidebar" id="sidebar" hidden>
      <div class="sidebar-head">
        <div class="filter-tabs" id="filter-tabs" role="tablist">
          <button class="filter-btn active" data-filter="changed" type="button">Changed</button>
          <button class="filter-btn"        data-filter="all"     type="button">All</button>
        </div>
        <button id="download-btn" class="btn btn-ghost sidebar-download" type="button" title="Download the original tarball(s) the app fetched">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          <span class="label">Download</span>
        </button>
      </div>
      <div class="file-tree" id="file-tree"></div>
    </aside>
    <main class="diff-pane" id="diff-pane">
      <section class="diff" id="diff">
        <div class="empty">Search a crate above to compare versions.</div>
      </section>
      <footer>
        <p><a href="https://github.com/leighmcculloch/unpackage.dev" target="_blank" rel="noopener">github.com/leighmcculloch/unpackage.dev</a></p>
      </footer>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/diff@5.2.0/dist/diff.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/highlight.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
